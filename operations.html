<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registo de Localização de Equipamento</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: #f5f7fa; padding: 20px; color: #1a1a1a; }
.container { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
h1 { font-size: 1.4rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.subtitle { color: #666; font-size: 0.9rem; margin-bottom: 24px; }
.section { margin-bottom: 28px; }
.section-title { font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.field { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.field label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
.field value { font-size: 1rem; font-weight: 500; }
.photo-box { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
.photo-box:hover, .photo-box.dragover { border-color: #3b82f6; background: #eff6ff; }
.photo-box img { max-width: 100%; max-height: 220px; border-radius: 8px; margin-top: 12px; }
.btn { display: block; width: 100%; background: #2563eb; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
.btn:disabled { background: #94a3b8; cursor: not-allowed; }
.status { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
.loading { background: #fef3c7; color: #92400e; }
.success { background: #dcfce7; color: #166534; }
.error { background: #fee2e2; color: #991b1b; }
input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Registo de Localização de Equipamento</h1>
  <p class="subtitle">Preenchido automaticamente após leitura do QR Code</p>

  <div id="status" class="status loading">A obter a sua localização...</div>

  <div class="section">
    <div class="section-title">Dados de localização</div>
    <div class="field">
      <label>Latitude</label>
      <div id="lat">—</div>
    </div>
    <div class="field">
      <label>Longitude</label>
      <div id="lng">—</div>
    </div>
    <div class="field">
      <label>Morada</label>
      <div id="address">A carregar...</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📷 Fotografia</div>
    <div class="photo-box" id="photoBox" onclick="document.getElementById('photoInput').click()">
      <div id="photoPlaceholder">
        <div style="font-size: 2rem; margin-bottom: 8px;">📷</div>
        <div>Toque para tirar ou escolher fotografia</div>
      </div>
      <img id="preview" style="display:none;">
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment">
  </div>

  <button class="btn" id="submitBtn" disabled>Enviar</button>
</div>

<script>
let latitude = null;
let longitude = null;
let address = null;
let photoFile = null;

// 1. Obter localização do utilizador
function getLocation() {
  if (!navigator.geolocation) {
    showStatus("O seu browser não suporta geolocalização", "error");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      latitude = position.coords.latitude.toFixed(6);
      longitude = position.coords.longitude.toFixed(6);

      document.getElementById("lat").textContent = latitude;
      document.getElementById("lng").textContent = longitude;

      // 2. Converter coordenadas em morada (Nominatim - OpenStreetMap)
      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`,
          { headers: { "Accept-Language": "pt" } }
        );
        const data = await response.json();
        address = data.display_name || "Morada não encontrada";
        document.getElementById("address").textContent = address;
        showStatus("Localização obtida com sucesso", "success");
        checkFormReady();
      } catch (err) {
        address = "Não foi possível obter a morada";
        document.getElementById("address").textContent = address;
        showStatus("Localização obtida (morada indisponível)", "success");
        checkFormReady();
      }
    },
    (error) => {
      let msg = "Erro ao obter localização. ";
      if (error.code === 1) msg += "Permissão negada.";
      if (error.code === 2) msg += "Posição indisponível.";
      if (error.code === 3) msg += "Tempo esgotado.";
      showStatus(msg, "error");
    },
    { enableHighAccuracy: true, timeout: 15000 }
  );
}

// 3. Pré-visualização da fotografia
document.getElementById("photoInput").addEventListener("change", function (e) {
  const file = e.target.files[0];
  if (!file) return;

  photoFile = file;
  const reader = new FileReader();
  reader.onload = function (event) {
    document.getElementById("preview").src = event.target.result;
    document.getElementById("preview").style.display = "block";
    document.getElementById("photoPlaceholder").style.display = "none";
    checkFormReady();
  };
  reader.readAsDataURL(file);
});

function checkFormReady() {
  const btn = document.getElementById("submitBtn");
  if (latitude && longitude && photoFile) {
    btn.disabled = false;
  }
}

function showStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + type;
}

// 4. Enviar dados
document.getElementById("submitBtn").addEventListener("click", async function () {
  const btn = this;
  btn.disabled = true;
  btn.textContent = "A enviar...";

  // URL do Microsoft Forms
  const MS_FORMS_BASE_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=fS148hvRukqiaryHgkCctUimWUgW4hBFogSeh6uJAH9UNUQ1TDc4WTFVNEZJRFRBOUFETklCSTIzTS4u";

  const url = new URL(MS_FORMS_BASE_URL);
  url.searchParams.set("Morada", address || "");
  url.searchParams.set("Latitude", latitude || "");
  url.searchParams.set("Longitude", longitude || "");

  try {
    // Redireccionar para o Forms
    window.location.href = url.toString();
  } catch (err) {
    // Fallback: mostrar os dados e permitir copiar
    showStatus("Erro ao enviar. Os dados estão prontos abaixo.", "error");
    console.log({
      latitude,
      longitude,
      morada: address,
      foto: photoFile ? photoFile.name : "(sem foto)"
    });
    alert(
      `Dados prontos:\n\n` +
      `Latitude: ${latitude}\n` +
      `Longitude: ${longitude}\n` +
      `Morada: ${address}\n` +
      `Foto: ${photoFile ? photoFile.name : "(sem foto)"}`
    );
    btn.disabled = false;
    btn.textContent = "Enviar";
  }
});

// Iniciar logo ao carregar a página
getLocation();
</script>
</body>
</html>
